global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Django API metrics (development)
  - job_name: 'django-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Next.js Web App (development)
  - job_name: 'nextjs-web'
    static_configs:
      - targets: ['web:3000']
    scrape_interval: 30s

  # React Native App (development)
  - job_name: 'react-native-app'
    static_configs:
      - targets: ['app:8081']
    scrape_interval: 30s

  # PostgreSQL (development)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis (development)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Vault (development)
  - job_name: 'vault'
    static_configs:
      - targets: ['vault:8200']
    scrape_interval: 30s