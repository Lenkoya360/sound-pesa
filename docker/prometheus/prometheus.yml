global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Django API metrics
  - job_name: 'django-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Bitcoin Core metrics
  - job_name: 'bitcoin-core'
    static_configs:
      - targets: ['bitcoin-core:8332']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Ethereum Geth metrics
  - job_name: 'geth'
    static_configs:
      - targets: ['geth:6060']
    metrics_path: '/debug/metrics/prometheus'
    scrape_interval: 30s

  # Cardano Node metrics
  - job_name: 'cardano-node'
    static_configs:
      - targets: ['cardano-node:12798']
    scrape_interval: 30s

  # Polkadot Node metrics
  - job_name: 'polkadot-node'
    static_configs:
      - targets: ['polkadot-node:9615']
    scrape_interval: 30s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']

  # Celery metrics
  - job_name: 'celery-exporter'
    static_configs:
      - targets: ['celery-exporter:9540']