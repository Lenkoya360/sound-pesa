# Bitcoin Core Configuration for Sound Pesa Platform

# Network settings
testnet=1
listen=1
server=1
daemon=1

# RPC settings
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0:8332
rpcuser=soundpesa
rpcpassword=REPLACE_WITH_SECURE_PASSWORD

# Connection settings
maxconnections=40
addnode=testnet-seed.bitcoin.jonasschnelli.ch
addnode=seed.tbtc.petertodd.org
addnode=seed.testnet.bitcoin.sprovoost.nl
addnode=testnet-seed.bluematt.me

# Performance settings
dbcache=512
maxmempool=300
mempoolexpiry=72

# Indexing
txindex=1
addresstype=bech32
changetype=bech32

# ZeroMQ notifications
zmqpubrawblock=tcp://0.0.0.0:28332
zmqpubrawtx=tcp://0.0.0.0:28333
zmqpubhashtx=tcp://0.0.0.0:28334
zmqpubhashblock=tcp://0.0.0.0:28335

# REST interface
rest=1

# Logging
debug=rpc
debug=zmq
printtoconsole=1

# Security
disablewallet=0
walletbroadcast=1

# Pruning (set to 0 to disable pruning for full node)
prune=0