server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # System logs
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  # Django API logs (structured JSON)
  - job_name: django-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: django-api
          service: api
          __path__: /var/lib/docker/containers/*api*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
            time: time
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - json:
          expressions:
            level: level
            module: module
            message: message
            correlation_id: correlation_id
            user_id: user_id
            transaction_id: transaction_id
          source: output
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
          level:
          module:
          service:
      - output:
          source: message

  # Nginx access logs
  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          service: nginx
          __path__: /var/lib/docker/containers/*nginx*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - regex:
          expression: '(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<request_uri>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
          source: output
      - timestamp:
          format: 02/Jan/2006:15:04:05 -0700
          source: time_local
      - labels:
          method:
          status:
          service:
      - output:
          source: output

  # Blockchain node logs
  - job_name: blockchain-nodes
    static_configs:
      - targets:
          - localhost
        labels:
          job: blockchain-nodes
          __path__: /var/lib/docker/containers/*{bitcoin,geth,cardano,polkadot}*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
            time: time
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - regex:
          expression: '(?P<blockchain>bitcoin|ethereum|cardano|polkadot)'
          source: container_name
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
          blockchain:
      - output:
          source: output

  # Security audit logs
  - job_name: security-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: security-audit
          service: api
          __path__: /var/lib/docker/containers/*api*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - match:
          selector: '{job="security-audit"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
                  event_type: event_type
                  user_id: user_id
                  ip_address: ip_address
                  user_agent: user_agent
                source: output
            - match:
                selector: '{level=~"WARNING|ERROR|CRITICAL"}'
                stages:
                  - labels:
                      level:
                      event_type:
                      service:
      - timestamp:
          format: RFC3339Nano
          source: time
      - output:
          source: message